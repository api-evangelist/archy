aid: archy
name: Archy
description: >-
  Archy is an all-in-one, cloud-based dental practice management platform that consolidates scheduling,
  clinical charting, imaging, insurance verification, billing, patient communication, online payments,
  and reporting into a single system, layered with AI agents (Scribe for clinical notes, Revenue for
  insurance claim posting, Intelligence for analytics, and Verify for real-time insurance verification)
  that automate routine practice workflows. Founded in 2021 by Jonathan Rat and Benjamin Kolin and backed
  by TCV, Bessemer Venture Partners, CRV, and Entree Capital, Archy has raised roughly $47M through a 2025
  Series B and serves tens of thousands of active users across dental practices. As a handler of protected
  health information it is HIPAA-compliant, publishes a Vanta-hosted trust center, and ships native iOS and
  Android apps. Archy exposes no public developer API; this profile is maintained by the API Evangelist
  network for identity, security, and discoverability coverage.
